name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@seam-agency"
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build token-free release artifact
        if: github.event_name == 'release'
        shell: bash
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts
          mv release-artifacts/seam-agency-mascot-react-*.tgz release-artifacts/seam-mascot-react.tgz
      - name: Upload token-free release artifact
        if: github.event_name == 'release'
        run: gh release upload "$GITHUB_REF_NAME" release-artifacts/seam-mascot-react.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Add token-free install instructions
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json body --jq .body | grep -Eq '^## Token-free install\r?$'; then
            exit 0
          fi

          gh release view "$GITHUB_REF_NAME" --json body --jq .body > release-notes.md
          cat >> release-notes.md <<'EOF'

          ## Token-free install

          ```bash
          npm install https://github.com/Seam-Agency/seam-mascot-react/releases/latest/download/seam-mascot-react.tgz
          ```
          EOF
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
