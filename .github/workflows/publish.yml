name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@seam-agency"
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build token-free release artifact
        if: github.event_name == 'release'
        shell: bash
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts
          mv release-artifacts/seam-agency-mascot-react-*.tgz release-artifacts/seam-mascot-react.tgz
      - name: Upload token-free release artifact
        if: github.event_name == 'release'
        run: gh release upload "$GITHUB_REF_NAME" release-artifacts/seam-mascot-react.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
